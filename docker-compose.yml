services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_hub}
      POSTGRES_USER: ${POSTGRES_USER:-school_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_hub}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/school-hub-media;
      mc anonymous set download local/school-hub-media;
      exit 0;
      "

  web:
    build:
      context: .
      args:
        ENVIRONMENT: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgres://${POSTGRES_USER:-school_hub}:${POSTGRES_PASSWORD:-school_hub}@db:5432/${POSTGRES_DB:-school_hub}
      - DEBUG=True
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_CUSTOM_DOMAIN=localhost:9000/school-hub-media
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET_NAME=school-hub-media
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
