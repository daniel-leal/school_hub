[project]
name = "school-hub"
version = "0.1.0"
description = "Platform for managing school events and parent coordination"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "boto3>=1.34,<2.0",
    "crispy-tailwind>=1.0,<2.0",
    "dependency-injector>=4.41,<5.0",
    "dj-database-url>=2.1,<3.0",
    "django>=5.1,<5.2",
    "django-chartjs>=2.3,<3.0",
    "django-crispy-forms>=2.1,<3.0",
    "django-storages[s3]>=1.14,<2.0",
    "django-unfold>=0.40,<1.0",
    "django-widget-tweaks>=1.5,<2.0",
    "pillow>=10.0,<11.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-decouple>=3.8,<4.0",
    "qrcode[pil]>=7.4,<8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 140
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002",
    "ARG005",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["apps", "config"]
exclude = [
    "**/__pycache__",
    "**/migrations",
    ".venv",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--reuse-db",
    "-v",
]

[dependency-groups]
dev = [
    "boto3>=1.34,<2.0",
    "crispy-tailwind>=1.0,<2.0",
    "dependency-injector>=4.41,<5.0",
    "dj-database-url>=2.1,<3.0",
    "django>=5.1,<5.2",
    "django-chartjs>=2.3,<3.0",
    "django-crispy-forms>=2.1,<3.0",
    "django-debug-toolbar>=4.2,<5.0",
    "django-extensions>=3.2,<4.0",
    "django-storages[s3]>=1.14,<2.0",
    "django-stubs>=5.0,<6.0",
    "django-unfold>=0.40,<1.0",
    "django-widget-tweaks>=1.5,<2.0",
    "factory-boy>=3.3,<4.0",
    "faker>=25.0,<26.0",
    "ipython>=8.0,<9.0",
    "pillow>=10.0,<11.0",
    "psycopg[binary]>=3.1,<4.0",
    "pyright>=1.1,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-django>=4.5,<5.0",
    "python-decouple>=3.8,<4.0",
    "qrcode[pil]>=7.4,<8.0",
    "ruff>=0.7,<1.0",
]
prod = [
    "gunicorn>=21.0,<22.0",
    "sentry-sdk>=1.38,<2.0",
    "uvicorn>=0.27,<1.0",
    "whitenoise>=6.6,<7.0",
]
